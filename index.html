<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vexilla – Flag Quiz</title>
<style>
:root{--bg:#eaf2fb;--card:#fff;--ink:#10243e;--mute:#5b6b80;--line:#c9d6e6;--acc:#ffc93c;--accink:#10243e;--ok:#1f9d63;--bad:#d6403a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--card:#172a43;--ink:#eef3fa;--mute:#9fb0c6;--line:#2c4466;--ok:#3fc487;--bad:#ff6b63}}
:root[data-theme="dark"]{--bg:#0e1a2b;--card:#172a43;--ink:#eef3fa;--mute:#9fb0c6;--line:#2c4466;--ok:#3fc487;--bad:#ff6b63}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 16px 32px}
h1{font-size:2rem;margin:8px 0 6px;letter-spacing:-.02em}
p{color:var(--mute);line-height:1.5;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.flag{background:var(--card);border:2px solid var(--line);border-radius:18px;text-align:center;padding:22px 10px;margin-bottom:16px}
.flag span{font-size:clamp(112px,40vw,176px);line-height:1.1;display:block}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1rem;text-align:left}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.opt:disabled{cursor:default}
.go{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:1.05rem;width:100%;margin-top:14px}
.fb{min-height:1.4em;font-weight:700;margin-top:12px}
.big{font-size:4rem;font-weight:800;line-height:1;margin:8px 0}
.miss{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.miss b{font-size:1.8rem}
.lbl{font-weight:700;margin:6px 0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.seg button{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700}
.seg button small{display:block;font-weight:500;color:var(--mute);margin-top:2px;font-size:.72rem}
.seg button[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--card))}
.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1 small{font-size:.9rem;color:var(--mute);font-weight:600;margin-left:8px}
.flag span.name{font-size:2rem;font-weight:800;padding:34px 0;line-height:1.2}
.opts.vis{grid-template-columns:1fr 1fr}
.opt.fl{font-size:clamp(56px,18vw,80px);text-align:center;padding:8px;line-height:1.2}
#timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
.go.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.mini{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.9rem}
.mini:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btns{display:flex;gap:6px;margin-left:auto}
.top{flex-wrap:wrap;gap:4px 10px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg.hidden{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font-size:1.25rem}
#start .c1,#start .c2{display:contents}
#start:not(.hidden){display:flex;flex-direction:column;height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#start>*,#start .c1>*,#start .c2>*{flex:none}
#start .flag{flex:1 1 40px;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;margin-bottom:10px}
#start .flag span{font-size:min(14vh,84px);white-space:nowrap}
#start p{margin-bottom:10px}
#levels{grid-template-columns:repeat(4,1fr)}
.flag.big{padding:40px 10px}
.flag.big #flag{font-size:clamp(170px,62vw,300px)}
.flag.big,.flag.split{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:min(60dvh,460px);gap:6px;padding:26px 6px}

#ans{display:none;text-align:center;min-height:4.6rem;overflow-wrap:anywhere;line-height:1.2;width:100%}
#nm{display:block;font-size:clamp(1.8rem,9vw,2.8rem);font-weight:800}
#cap{display:block;font-style:normal;color:var(--mute);font-size:1.5rem;font-weight:700;margin-top:8px}
#ff{display:block;font-style:normal;font-weight:700;font-size:1.05rem;line-height:1.35;margin:12px auto 0;max-width:30em;text-align:center}
#ff div{margin-top:4px}
.ko{font-style:normal;white-space:nowrap}
.top{position:relative}
@media (max-width:440px){.mt{display:none}}
.flag.split #flag{display:none}
.flag.split #ans{display:block}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (orientation:landscape) and (max-height:560px){
main{max-width:920px;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.5rem;margin:2px 0 4px}
p{margin-bottom:8px}
#start:not(.hidden){display:grid;grid-template-columns:1fr 1fr;gap:0 20px;height:calc(100dvh - 22px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#start .c1,#start .c2{display:flex;flex-direction:column;min-height:0}
#start .c2{justify-content:center}
#start .lbl{margin:2px 0}
#start .seg button{padding:6px 4px}
#game:not(.hidden){display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"top top" "bar bar" "flag opts" "fb next";gap:6px 18px;align-items:center}
#game .top{grid-area:top;margin-bottom:0}
#game .bar{grid-area:bar;margin-bottom:4px}
#game .flag{grid-area:flag;margin:0;padding:10px}
#game #opts{grid-area:opts}
#game #fb{grid-area:fb;margin:0}
#game #next{grid-area:next;margin:0}
.flag span{font-size:min(34vh,120px)}
.flag.big #flag{font-size:min(52vh,200px)}
#ans{min-height:3rem}
#nm{font-size:clamp(1.9rem,10vh,3rem);line-height:1.1}
#cap{font-size:1.5rem;font-weight:700;margin-top:8px}
#ff{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:1rem;font-weight:700;margin-top:6px;max-width:none;width:100%}
#ff div{margin-top:0}

.flag.big,.flag.split{padding:10px;min-height:min(70dvh,260px)}
#game.timed .flag{grid-column:1/-1}
#game .mini{padding:3px 9px}
.opt{padding:10px 14px}
.go{padding:11px 18px}
.seg{margin-bottom:8px}
}
</style>
</head>
<body>
<main>
<section id="start">
  <div class="c1"><h1>Vexilla<small>v1.12.0</small></h1>
  <p>Ten flags per round. Choose a mode and a difficulty, build a streak, and beat your best score.</p>
  <div class="flag"><span>🇰🇷 🇳🇿 🇺🇸</span></div>
  </div>
  <div class="c2">
  <div class="lbl">Mode</div>
  <div class="seg" id="modes"></div>
  <div class="lbl">Difficulty</div>
  <div class="seg" id="levels"></div>
  <p id="mdesc"></p>
  <p id="best"></p>
  <button class="go" id="startBtn">Start round</button></div>
</section>

<section id="game" class="hidden">
  <div class="top"><span id="qn"></span><span id="timer"></span><span id="streak"></span><span class="btns"><button class="mini hidden" id="pause" aria-label="Pause">⏸</button><button class="mini hidden" id="skip" aria-label="Next flag">⏭</button><button class="mini hidden" id="stop" aria-label="Menu">☰<span class="mt"> Menu</span></button></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="flag"><span id="flag" role="img" aria-label="Flag"></span><span id="ans"><b id="nm"></b><i id="cap"></i><em id="ff"></em></span></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="go hidden" id="next">Next flag</button>
</section>

<section id="end" class="hidden">
  <h1>Round complete</h1>
  <div class="big" id="score"></div>
  <p id="msg"></p>
  <div id="misses"></div>
  <button class="go" id="again">Play again</button>
  <button class="go alt" id="menu">Change mode or difficulty</button>
</section>
</main>

function home(){unlock();
  seg("modes",MD,mode,k=>{mode=k});
  seg("levels",LV,level,k=>{level=k;pool=LV[k].p});
  $("mdesc").textContent=MD[mode].d;
  const b=getBest();$("best").textContent=mode==="timed"?"":b?"Best on this setting: "+b+" / "+N:"No best score on this setting yet.";show("start")}
function begin(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  clearInterval(tid);clearTimeout(adv);$("game").classList.toggle("timed",mode==="timed");
  if(mode==="timed"){lock();deck=[];n=0;lap=1;askTimed();return}
  qs=shuffle(pool).slice(0,N);i=0;score=0;streak=0;misses=[];ask()}
function ask(){
  const a=qs[i];
  const opts=shuffle([a,...shuffle(pool.filter(c=>c!==a)).slice(0,3)]);
  $("qn").textContent="Flag "+(i+1)+" of "+N;
  $("streak").textContent=streak>1?"Streak: "+streak:"";
  $("prog").style.width=(i/N*100)+"%";
  const vis=mode==="timed";
  $("flag").textContent=emoji(a);$("flag").className="";
  $("fb").textContent="";$("fb").style.color="";$("fb").style.fontSize="";
  $("next").classList.add("hidden");
  $("opts").innerHTML="";$("opts").className=vis?"opts vis":"opts";
  if(!vis)opts.forEach(c=>{const b=document.createElement("button");b.className=vis?"opt fl":"opt";b.textContent=vis?emoji(c):C[c];b.onclick=()=>pick(b,c,a);b.dataset.c=c;$("opts").appendChild(b)});
  phase=null;paused=false;["pause","skip"].forEach(x=>$(x).classList.add("hidden"));$("stop").classList.remove("hidden");document.querySelector("#game .flag").className="flag";$("nm").textContent="";$("cap").textContent="";$("ff").textContent="";show("game");if(vis)startTimer(a);else{clearInterval(tid);$("timer").textContent=""}
}
function pick(btn,c,a){clearInterval(tid);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.c===a)b.classList.add("ok")});
  if(c===a){score++;streak++;$("fb").textContent="Correct";$("fb").style.color="var(--ok)"}
  else{streak=0;misses.push(a);if(btn)btn.classList.add("bad");$("fb").textContent="It’s "+C[a];$("fb").style.color="var(--bad)";if(mode==="timed")$("fb").textContent=c?"Wrong":"Time’s up"}
  $("streak").textContent=streak>1?"Streak: "+streak:"";
  $("next").textContent=i===N-1?"See results":"Next flag";
  $("next").classList.remove("hidden");$("next").focus();
}
let tid,left,ac,cur,phase,wl=null;
async function lock(){try{const v=$("nosleep");if(v){v.play().catch(()=>{})}}catch(e){}try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){wl=null}}
function unlock(){try{const v=$("nosleep");if(v)v.pause()}catch(e){}try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&mode==="timed"&&!$("game").classList.contains("hidden"))lock()});
function beep(f,d){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function tick(snd){$("timer").textContent=left+" s";$("timer").className=left<=3?"low":"";if(snd&&left>0&&left<=3)beep(880,.12);if(snd&&left===0)beep(330,.5)}
let deck=[],n=0,lap=1,last=null,adv,paused=false;
function askTimed(){
  if(!deck.length){deck=shuffle(pool);if(n>0)lap++}
  if(deck.length>1&&deck[deck.length-1]===last){const t=deck.length-1;[deck[0],deck[t]]=[deck[t],deck[0]]}
  const a=deck.pop();last=a;n++;
  const k=pool.length-deck.length;
  $("qn").textContent="Flag "+k+"/"+pool.length+(lap>1?", round "+lap:"");
  $("streak").textContent="";$("prog").style.width=(k/pool.length*100)+"%";
  $("flag").textContent=emoji(a);$("nm").textContent="";$("cap").textContent="";$("ff").textContent="";
  document.querySelector("#game .flag").className="flag big";
  $("opts").innerHTML="";$("fb").textContent="";
  $("next").classList.add("hidden");["pause","skip","stop"].forEach(x=>$(x).classList.remove("hidden"));paused=false;$("pause").textContent="⏸";
  show("game");startTimer(a);
}
function reveal(a){phase="reveal";clearTimeout(adv);$("timer").textContent="";document.querySelector("#game .flag").className="flag split";$("nm").innerHTML=C[a]+' <i class="ko">'+(KO[a]||"")+'</i>';$("cap").textContent="Capital city: "+(CAP[a]||"");showInfo(a);adv=setTimeout(askTimed,7000)}
function startTimer(a){cur=a;phase="count";left=10;tick(false);runTimer(a)}
function runTimer(a){clearInterval(tid);tid=setInterval(()=>{left--;tick(true);if(left<=0){clearInterval(tid);reveal(a)}},1000)}
function pauseGame(){clearInterval(tid);clearTimeout(adv);$("dlg").classList.remove("hidden");$("keep").focus()}
function resumeRun(){if(phase==="count")runTimer(cur);else if(phase==="reveal")adv=setTimeout(askTimed,3500)}
function resumeGame(){$("dlg").classList.add("hidden");if(!paused)resumeRun()}
function togglePause(){paused=!paused;$("pause").textContent=paused?"▶":"⏸";$("pause").setAttribute("aria-label",paused?"Resume":"Pause");if(paused){clearInterval(tid);clearTimeout(adv);$("fb").textContent="Paused"}else{$("fb").textContent="";resumeRun()}}
function skipFlag(){if(phase==="count"){clearInterval(tid);paused=false;$("pause").textContent="⏸";$("fb").textContent="";reveal(cur)}else{clearInterval(tid);clearTimeout(adv);askTimed()}}
function finish(){
  const prev=getBest();$("prog").style.width="100%";if(mode==="timed"){$("score").textContent=N+" flags";$("msg").textContent="Flags from this round. Play again for a new set.";$("misses").innerHTML="<p><b>Review</b></p>";qs.forEach(c=>{const d=document.createElement("div");d.className="miss";d.innerHTML="<b></b><span></span>";d.firstChild.textContent=emoji(c);d.lastChild.textContent=C[c];$("misses").appendChild(d)});show("end");return}
  $("score").textContent=score+" / "+N;
  let m=score===N?"Perfect round.":score>=7?"Strong round.":score>=4?"Solid start. Another round will help.":"Tough one. Try again.";
  if(score>prev){setBest(score);m+=" New best score.";}
  $("msg").textContent=m;
  $("misses").innerHTML=misses.length?"<p><b>Review</b></p>":"";
  misses.forEach(c=>{const d=document.createElement("div");d.className="miss";d.innerHTML="<b></b><span></span>";d.firstChild.textContent=emoji(c);d.lastChild.textContent=C[c];$("misses").appendChild(d)});
  show("end");
}
$("startBtn").onclick=begin;$("again").onclick=begin;$("menu").onclick=home;$("stop").onclick=pauseGame;$("pause").onclick=togglePause;$("skip").onclick=skipFlag;$("keep").onclick=resumeGame;$("leave").onclick=()=>{$("dlg").classList.add("hidden");phase=null;paused=false;home()};
$("next").onclick=()=>{i++;i<N?ask():finish()};
home();
</script>
</body>
</html>
