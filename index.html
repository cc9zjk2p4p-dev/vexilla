<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vexilla – Flag Quiz</title>
<style>
:root{--bg:#eaf2fb;--card:#fff;--ink:#10243e;--mute:#5b6b80;--line:#c9d6e6;--acc:#ffc93c;--accink:#10243e;--ok:#1f9d63;--bad:#d6403a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--card:#172a43;--ink:#eef3fa;--mute:#9fb0c6;--line:#2c4466;--ok:#3fc487;--bad:#ff6b63}}
:root[data-theme="dark"]{--bg:#0e1a2b;--card:#172a43;--ink:#eef3fa;--mute:#9fb0c6;--line:#2c4466;--ok:#3fc487;--bad:#ff6b63}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 16px 32px}
h1{font-size:2rem;margin:8px 0 6px;letter-spacing:-.02em}
p{color:var(--mute);line-height:1.5;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.flag{background:var(--card);border:2px solid var(--line);border-radius:18px;text-align:center;padding:22px 10px;margin-bottom:16px}
.flag span{font-size:clamp(112px,40vw,176px);line-height:1.1;display:block}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:1rem;text-align:left}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.opt:disabled{cursor:default}
.go{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:1.05rem;width:100%;margin-top:14px}
.fb{min-height:1.4em;font-weight:700;margin-top:12px}
.big{font-size:4rem;font-weight:800;line-height:1;margin:8px 0}
.miss{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.miss b{font-size:1.8rem}
.lbl{font-weight:700;margin:6px 0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.seg button{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700}
.seg button small{display:block;font-weight:500;color:var(--mute);margin-top:2px;font-size:.72rem}
.seg button[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--card))}
.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1 small{font-size:.9rem;color:var(--mute);font-weight:600;margin-left:8px}
.flag span.name{font-size:2rem;font-weight:800;padding:34px 0;line-height:1.2}
.opts.vis{grid-template-columns:1fr 1fr}
.opt.fl{font-size:clamp(56px,18vw,80px);text-align:center;padding:8px;line-height:1.2}
#timer{font-weight:800;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
.go.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.mini{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.9rem}
.mini:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btns{display:flex;gap:6px;margin-left:auto}
.top{flex-wrap:wrap;gap:4px 10px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg.hidden{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font-size:1.25rem}
#start .c1,#start .c2{display:contents}
#start:not(.hidden){display:flex;flex-direction:column;height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#start>*,#start .c1>*,#start .c2>*{flex:none}
#start .flag{flex:1 1 40px;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;margin-bottom:10px}
#start .flag span{font-size:min(14vh,84px);white-space:nowrap}
#start p{margin-bottom:10px}
#levels{grid-template-columns:repeat(4,1fr)}
.flag.big{padding:40px 10px}
.flag.big #flag{font-size:clamp(170px,62vw,300px)}
.flag.big,.flag.split{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:min(60dvh,460px);gap:6px;padding:26px 6px}

#ans{display:none;text-align:center;min-height:4.6rem;overflow-wrap:anywhere;line-height:1.2;width:100%}
#nm{display:block;font-size:clamp(1.8rem,9vw,2.8rem);font-weight:800}
#cap{display:block;font-style:normal;color:var(--mute);font-size:1.5rem;font-weight:700;margin-top:8px}
#ff{display:block;font-style:normal;font-weight:700;font-size:1rem;line-height:1.35;margin:12px auto 0;max-width:30em;text-align:center;white-space:pre-line}
.flag.split #flag{display:none}
.flag.split #ans{display:block}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (orientation:landscape) and (max-height:560px){
main{max-width:920px;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.5rem;margin:2px 0 4px}
p{margin-bottom:8px}
#start:not(.hidden){display:grid;grid-template-columns:1fr 1fr;gap:0 20px;height:calc(100dvh - 22px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#start .c1,#start .c2{display:flex;flex-direction:column;min-height:0}
#start .c2{justify-content:center}
#start .lbl{margin:2px 0}
#start .seg button{padding:6px 4px}
#game:not(.hidden){display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"top top" "bar bar" "flag opts" "fb next";gap:6px 18px;align-items:center}
#game .top{grid-area:top;margin-bottom:0}
#game .bar{grid-area:bar;margin-bottom:4px}
#game .flag{grid-area:flag;margin:0;padding:10px}
#game #opts{grid-area:opts}
#game #fb{grid-area:fb;margin:0}
#game #next{grid-area:next;margin:0}
.flag span{font-size:min(34vh,120px)}
.flag.big #flag{font-size:min(52vh,200px)}
#ans{min-height:3rem}
#nm{font-size:clamp(2.2rem,11vh,3rem)}
#cap{font-size:1.5rem;font-weight:700;margin-top:16px}
#ff{font-size:1.25rem;font-weight:700;margin-top:16px}

.flag.big,.flag.split{padding:10px;min-height:min(70dvh,260px)}
#game.timed .flag{grid-column:1/-1}
#game .mini{padding:3px 9px}
.opt{padding:10px 14px}
.go{padding:11px 18px}
.seg{margin-bottom:8px}
}
</style>
</head>
<body>
<main>
<section id="start">
  <div class="c1"><h1>Vexilla<small>v1.11.0</small></h1>
  <p>Ten flags per round. Choose a mode and a difficulty, build a streak, and beat your best score.</p>
  <div class="flag"><span>🇰🇷 🇳🇿 🇺🇸</span></div>
  </div>
  <div class="c2">
  <div class="lbl">Mode</div>
  <div class="seg" id="modes"></div>
  <div class="lbl">Difficulty</div>
  <div class="seg" id="levels"></div>
  <p id="mdesc"></p>
  <p id="best"></p>
  <button class="go" id="startBtn">Start round</button></div>
</section>

<section id="game" class="hidden">
  <div class="top"><span id="qn"></span><span id="timer"></span><span id="streak"></span><span class="btns"><button class="mini hidden" id="pause" aria-label="Pause">⏸</button><button class="mini hidden" id="skip" aria-label="Next flag">⏭</button><button class="mini hidden" id="stop" aria-label="Menu">☰ Menu</button></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="flag"><span id="flag" role="img" aria-label="Flag"></span><span id="ans"><b id="nm"></b><i id="cap"></i><em id="ff"></em></span></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="go hidden" id="next">Next flag</button>
</section>

<section id="end" class="hidden">
  <h1>Round complete</h1>
  <div class="big" id="score"></div>
  <p id="msg"></p>
  <div id="misses"></div>
  <button class="go" id="again">Play again</button>
  <button class="go alt" id="menu">Change mode or difficulty</button>
</section>
</main>

  show("end");
}
$("startBtn").onclick=begin;$("again").onclick=begin;$("menu").onclick=home;$("stop").onclick=pauseGame;$("pause").onclick=togglePause;$("skip").onclick=skipFlag;$("keep").onclick=resumeGame;$("leave").onclick=()=>{$("dlg").classList.add("hidden");phase=null;paused=false;home()};
$("next").onclick=()=>{i++;i<N?ask():finish()};
home();
</script>
